            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay-historical/replay-controls/main-app-only/launch-smoke/launch.mp4
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay-historical/replay-controls/main-app-only/launch-smoke/launch-1.png
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay-historical/replay-controls/main-app-only/launch-smoke/launch-2.png
