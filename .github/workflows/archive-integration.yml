          paired = os.environ.get('RETAINED_WITH_STARTUP', 'false')
          if paired not in {'true', 'false'}:
              raise SystemExit('Invalid retained verification mode')
          if paired == 'true' and (
                  requested_run != '42160468600' or requested_source != 'c55e19c4f5cbe0d730499035d0a0ef712f6903a9'
                  or os.environ['STARTUP_REPLAY_RUN'] != '42174474046' or repo != 'Livara-Dev/Telegram-iOS'):
              raise SystemExit('Invalid paired retained verification coordinates')
          fetch_args = ['git', 'fetch', '--no-tags', '--depth', '1', 'origin', sha]
