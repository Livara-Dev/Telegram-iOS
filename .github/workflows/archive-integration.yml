          root.mkdir(parents=True, exist_ok=True)
          lines = []
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'SHA256SUMS':
                  digest = hashlib.sha256()
                  with path.open('rb') as source:
                      for chunk in iter(lambda: source.read(1024 * 1024), b''):
                          digest.update(chunk)
                  lines.append(digest.hexdigest() + '  ' + str(path.relative_to(root)) + '\n')
          (root / 'SHA256SUMS').write_text(''.join(lines))
          PYTHON

      - name: Publish synthetic renderer tests, source hashes, screenshots and variable-rate video
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: custom-options-ui-${{ github.sha }}
          path: ${{ github.workspace }}/fork-source/build/fork-evidence/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
