        run: |
          set -euo pipefail
          xcrun simctl list runtimes --json 2>&1 | tee build/fork-evidence/runtime.log
          python3 tools/fork_baseline/prepare_host.py --simulator

      # Reuse this invocation's private Bazel outputs after all eight native
      # suites pass. A test failure stops the app build; only public downloads
      # leave the private root. Startup smoke uses this exact produced IPA.
      - name: Build the full simulator app and run TextFormat regression tests
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          IOS_BUNDLE_ID: org.livara.ayugram
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 tools/fork_baseline/baseline.py simulator --integration-tests --build-number "${{ github.run_number }}" 2>&1 | tee build/fork-evidence/simulator.log

      - name: Hash early integration test evidence
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          evidence = Path('build/fork-evidence')
