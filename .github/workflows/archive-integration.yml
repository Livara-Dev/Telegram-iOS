      - name: Publish historical comparison evidence without its IPA
        if: always() && inputs.startup_historical_control
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: startup-historical-comparison-${{ github.sha }}
          path: |
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay-historical/verification.json
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay-historical/comparison.json
