          set -euo pipefail
          xcodebuild -downloadPlatform iOS -buildVersion 26.5 -architectureVariant arm64 2>&1 | tee build/fork-evidence/runtime.log
          python3 tools/fork_baseline/prepare_host.py --simulator

      # This job checks out the same requested SHA on a fresh hosted runner.
      # Setup/runtime downloads and core compilation may repeat; no private
      # Bazel state or credential-bearing cache is shared between the jobs.
      - name: Build the full simulator app and run TextFormat regression tests
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          IOS_BUNDLE_ID: org.livara.ayugram
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 tools/fork_baseline/baseline.py simulator 2>&1 | tee build/fork-evidence/simulator.log

