        continue-on-error: true
        if: always() && steps.public_dependencies.outcome == 'success' && github.repository == 'Livara-Dev/Telegram-iOS' && github.ref == 'refs/heads/ci/verify-latest'
        # Official actions/cache v4.2.4; tag resolved to this commit 2026-11-05.
