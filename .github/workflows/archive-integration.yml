            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-main-app-only-device/LICENSE-NOTICE.md
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-main-app-only-device/CORRESPONDING-SOURCE.md
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

      - name: Hash startup replay diagnostics without republishing the IPA
        if: always()
        run: |
          python3 - <<'PYTHON'
          import hashlib, pathlib
          root = pathlib.Path('build/fork-evidence/startup-replay')
          root.mkdir(parents=True, exist_ok=True)
          names = ['verification.json', 'archive-evidence/manifest.json', 'archive-evidence/prior-launch-result.json',
                   'replay-controls/replay.json']
          for control in ('normal', 'no-app-groups', 'main-app-only', 'main-app-only-automatic'):
              for name in ('result.json', 'checker-compiler.log', 'recording.log', 'launch.mp4', 'launch-1.png', 'launch-2.png'):
                  names.append('replay-controls/' + control + '/launch-smoke/' + name)
          rows = []
          for name in names:
              file = root / name
              if file.is_file() and not file.is_symlink():
                  rows.append(hashlib.sha256(file.read_bytes()).hexdigest() + '  ' + name + '\n')
          (root / 'SHA256SUMS').write_text(''.join(rows))
          PYTHON

