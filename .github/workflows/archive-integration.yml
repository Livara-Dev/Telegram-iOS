        run: |
          python3 - <<'PYTHON'
          import hashlib, pathlib, shutil, stat
          root = pathlib.Path('build/fork-evidence').absolute()
          if any(p.is_symlink() for p in (root, *root.parents)) or not root.is_dir():
              raise SystemExit('Invalid bounded modern diagnostic evidence')
          public = root / 'modern-projection-public'
          public.mkdir(mode=0o700)
          names = ['clean-simulator-service.json']
          for name in ('verification.json', 'result.json', 'control-build.log', 'control-test.log', 'control-cases.json', 'projection-test.log', 'projection-cases.json'):
              names.append('modern-projection-plan/' + name)
          checked, total = [], 0
          for name in names:
              source = root / name
              if any(p.is_symlink() for p in (source, *source.parents)):
                  raise SystemExit('Invalid bounded modern diagnostic evidence')
              if not source.exists():
                  continue
              info = source.stat()
              limit = (2 if source.suffix == '.log' else 1) * 1024**2
              total += info.st_size
              if not stat.S_ISREG(info.st_mode) or not 0 <= info.st_size <= limit or total > 8 * 1024**2:
                  raise SystemExit('Invalid bounded modern diagnostic evidence')
              checked.append(source)
          checksums = []
          for source in checked:
