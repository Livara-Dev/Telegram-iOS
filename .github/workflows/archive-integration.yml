      # Xcode already contains the device SDK. No simulator runtime is
      # downloaded on this fresh runner. Only pinned public downloads are shared.
      - name: Compile unsigned device package
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          IOS_BUNDLE_ID: org.livara.ayugram
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 tools/fork_baseline/baseline.py unsigned-device --build-number "${{ github.run_number }}" 2>&1 | tee build/fork-evidence/unsigned-device.log

      - name: Verify active fork branding in the unsigned device IPA
        run: python3 tools/fork_baseline/branding.py --ipa build/fork-baseline-unsigned-device/Telegram.ipa --bundle org.livara.ayugram --output build/fork-evidence/branding.json

      - name: Export verified public dependency downloads
        continue-on-error: true
        if: always() && github.repository == 'Livara-Dev/Telegram-iOS' && github.ref == 'refs/heads/ci/verify-latest'
        id: public_dependencies
        run: python3 tools/fork_baseline/dependency_cache.py export

