          set -euo pipefail
          python3 tools/fork_baseline/launch_smoke.py --ipa build/fork-baseline-simulator/Telegram.ipa --output build/fork-evidence/launch-smoke

      - name: Hash retained evidence
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          evidence = Path('build/fork-evidence')
          evidence.mkdir(parents=True, exist_ok=True)
          files = sorted(p for p in evidence.rglob('*') if p.is_file() and p.name != 'SHA256SUMS')
          (evidence / 'SHA256SUMS').write_text(''.join(
              hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + str(p.relative_to(evidence)) + '\n'
              for p in files))
          PY

      - name: Publish simulator build evidence and successful package
        if: always()
        # Official actions/upload-artifact v4.6.2, tag SHA verified 2026-11-04.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: archive-integration-${{ github.sha }}
          path: |
            ${{ github.workspace }}/fork-source/build/fork-evidence/
            ${{ github.workspace }}/fork-source/build/fork-baseline-simulator/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false

      # No Apple signing keys are needed for this workflow. Packages are development
      # integration artifacts, not a telemetry-free release or an installable signed IPA.
