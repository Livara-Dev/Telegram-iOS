            --verification build/fork-evidence/startup-replay-device/verification.json \
            --simulator-verification build/fork-evidence/startup-replay/verification.json \
            --startup-proof build/fork-evidence/startup-replay/replay-controls/replay.json \
            --startup-result build/fork-evidence/startup-replay/replay-controls/main-app-only/launch-smoke/result.json \
