  custom-options-artifact-replay:
    # The frozen settings host is a synthetic account-free renderer, not the
    # full app. Modern mode builds only an Apple UI driver for this frozen host;
    # the legacy replay remains available as an explicit CLI diagnostic.
    if: github.event_name == 'workflow_dispatch' && (inputs.validation_scope == 'custom-options-replay' || inputs.validation_scope == 'custom-options-xctest' || inputs.validation_scope == 'retained-clean' || inputs.validation_scope == 'retained-modern')
    runs-on: xcode-27
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
        working-directory: ./fork-source
    steps:
      - name: Check out only the diagnostic tools and unchanged application source
        working-directory: ${{ github.workspace }}
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import base64, os, pathlib, re, subprocess
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'fork-source'
          sha = os.environ['GITHUB_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha) or os.environ['GITHUB_REPOSITORY'] != 'Livara-Dev/Telegram-iOS':
              raise SystemExit('Invalid cached settings checkout')
          root.mkdir(mode=0o700)
          def run(args, env=None): subprocess.run(args, cwd=root, env=env, check=True)
          run(['git', 'init', '-q'])
          run(['git', 'remote', 'add', 'origin', 'https://github.com/Livara-Dev/Telegram-iOS.git'])
          private = os.environ.copy()
          token = private.pop('CHECKOUT_TOKEN')
          private.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
              GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + token).encode()).decode())
          run(['git', 'fetch', '--no-tags', '--depth', '1', 'origin', sha, 'c55e19c4f5cbe0d730499035d0a0ef712f6903a9'], private)
          run(['git', 'checkout', '--detach', sha])
          (root / 'build/fork-evidence').mkdir(parents=True)
          PYTHON

      - name: Select the pinned Apple toolchain without installing Bazel
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          python3 - <<'PYTHON'
          import subprocess
          if subprocess.check_output(['xcodebuild', '-version'], text=True).splitlines()[0] != 'Xcode 27.1':
              raise SystemExit('Pinned Xcode unavailable')
          PYTHON

      - name: Test the retained settings and service lifecycle tools
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/fork_baseline/tests -p test_custom_options_replay.py -v
          python3 -m unittest discover -s tools/fork_baseline/tests -p test_clean_user_service.py -v

      - name: Test the native retained-host UI driver tools
        if: inputs.validation_scope == 'retained-modern' || inputs.validation_scope == 'custom-options-xctest'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/fork_baseline/tests -p test_custom_options_xctest.py -v
          python3 -m unittest discover -s tools/fork_baseline/tests -p test_tiny_ui_test_project.py -v

      - name: Refresh only the registered current-user simulator service on an exclusive hosted runner
        if: inputs.validation_scope == 'retained-clean'
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          AYU_CLEAN_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          AYU_CLEAN_SESSION: exclusive-cached-artifacts
          AYU_CLEAN_SOURCE: c55e19c4f5cbe0d730499035d0a0ef712f6903a9
          AYU_CLEAN_JOB: ${{ github.job }}
        run: python3 tools/fork_baseline/clean_user_service.py --output build/fork-evidence/clean-simulator-service.json

      - name: Verify the retained renderer artifact and identical current sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/fork_baseline/custom_options_replay.py prepare --output build/fork-evidence/custom-options-replay

      - name: Record the real retained native settings root without rebuilding it
        if: inputs.validation_scope != 'retained-modern' && inputs.validation_scope != 'custom-options-xctest'
        run: python3 tools/fork_baseline/custom_options_replay.py run --output build/fork-evidence/custom-options-replay

      - name: Verify the retained native settings root through Apple UI testing
        if: inputs.validation_scope == 'retained-modern' || inputs.validation_scope == 'custom-options-xctest'
        run: python3 tools/fork_baseline/custom_options_xctest.py run --output build/fork-evidence/custom-options-replay

      - name: Publish only closed settings replay observations and bounded visuals
        id: settings_evidence
        if: always()
        run: |
          python3 - <<'PYTHON'
          import hashlib, pathlib, shutil, stat
          root = pathlib.Path('build/fork-evidence').absolute()
          if any(p.is_symlink() for p in (root, *root.parents)) or not root.is_dir():
              raise SystemExit('Invalid bounded settings evidence')
          public = root / 'custom-options-replay-public'
          public.mkdir(parents=True, mode=0o700)
          names = ['clean-simulator-service.json']
          for name in ('verification.json', 'result.json', 'root-light.png', 'root-light.mp4', 'title-check-positive.png', 'xctest.log', 'case-results.json', 'driver-compiler.log'):
              names.append('custom-options-replay/' + name)
          checked, total = [], 0
          for name in names:
              source = root / name
              if any(p.is_symlink() for p in (source, *source.parents)):
                  raise SystemExit('Invalid bounded settings evidence')
              if not source.exists():
                  continue
              info = source.stat()
              limit = (32 if source.suffix == '.mp4' else 16 if source.suffix == '.png' else 2 if source.suffix == '.log' else 1) * 1024**2
              total += info.st_size
              if not stat.S_ISREG(info.st_mode) or not 0 <= info.st_size <= limit or total > 64 * 1024**2:
                  raise SystemExit('Invalid bounded settings evidence')
              checked.append(source)
          rows = []
          for source in checked:
              destination = public / source.name
              shutil.copyfile(source, destination)
              rows.append(hashlib.sha256(destination.read_bytes()).hexdigest() + '  ' + destination.name + '\n')
          (public / 'SHA256SUMS').write_text(''.join(rows))
          PYTHON

      - name: Upload retained native settings evidence without its simulator IPA
        if: always() && steps.settings_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: custom-options-artifact-replay-${{ github.sha }}
          path: ${{ github.workspace }}/fork-source/build/fork-evidence/custom-options-replay-public/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false

  custom-options-ui:
    # One native qualification also checks the account-free production renderer
    # on a separate runner. Keep the standalone scope for focused UI diagnostics.
    if: github.event_name == 'workflow_dispatch' && (inputs.validation_scope == 'custom-options-ui' || inputs.validation_scope == 'native-only')
    runs-on: xcode-27
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: ./fork-source
    steps:
      - name: Check out the exact requested revision
        working-directory: ${{ github.workspace }}
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib, re, subprocess
          destination = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'fork-source'
          destination.mkdir(mode=0o700)  # Requires a fresh, disposable runner.
          sha = os.environ['GITHUB_SHA']
          repo = os.environ['GITHUB_REPOSITORY']
          if not re.fullmatch(r'[0-9a-f]{40}', sha) or not re.fullmatch(r'[\w.-]+/[\w.-]+', repo):
              raise SystemExit('Invalid checkout coordinates')
          def run(args, env=None):
              subprocess.run(args, cwd=destination, env=env, check=True)
          run(['git', 'init', '-q'])
          run(['git', 'remote', 'add', 'origin', 'https://github.com/' + repo + '.git'])
          auth_env = os.environ.copy()
          token = auth_env.pop('CHECKOUT_TOKEN')
          auth_env.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
                          GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + token).encode()).decode())
          # Both exact trees are needed by the source guard; full history is not.
          run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', sha,
               '279f89e4d4f63f17227bf877dc3d8990f22ecd58'], auth_env)
          run(['git', 'checkout', '--detach', sha])
          # Relative upstream submodule URLs otherwise resolve under Livara-Dev.
          run(['git', 'submodule', 'init'])
          run(['git', 'config', 'submodule.submodules/rlottie/rlottie.url', 'https://github.com/TelegramMessenger/rlottie.git'])
          run(['git', 'config', 'submodule.submodules/TgVoipWebrtc/tgcalls.url', 'https://github.com/TelegramMessenger/tgcalls.git'])
          run(['git', 'submodule', 'update', '--init', '--recursive', '--depth', '1', '--jobs', '8'])
          (destination / 'build/fork-evidence').mkdir(parents=True)
          PY

      - name: Run portable renderer tooling contracts and source guard
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/fork_baseline/tests -v
          python3 tools/fork_audit/check.py
          python3 tools/fork_audit/telemetry.py

      - name: Select pinned Apple toolchain and verify Bazel
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          python3 tools/fork_baseline/prepare_host.py 2>&1 | tee build/fork-evidence/host.log

      - name: Build exact renderer host, run native controls and record real navigation
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          IOS_BUNDLE_ID: org.livara.ayugram
        run: |
          set -euo pipefail
          umask 077
          python3 tools/fork_baseline/custom_options_ui.py 2>&1 | tee build/fork-evidence/custom-options-ui.log

      - name: Hash synthetic renderer evidence
        if: always()
        run: |
          python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path
          root = Path('build/fork-evidence')
          root.mkdir(parents=True, exist_ok=True)
          lines = []
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'SHA256SUMS':
                  digest = hashlib.sha256()
                  with path.open('rb') as source:
                      for chunk in iter(lambda: source.read(1024 * 1024), b''):
                          digest.update(chunk)
                  lines.append(digest.hexdigest() + '  ' + str(path.relative_to(root)) + '\n')
          (root / 'SHA256SUMS').write_text(''.join(lines))
          PYTHON

      - name: Publish synthetic renderer tests, source hashes, screenshots and variable-rate video
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: custom-options-ui-${{ github.sha }}
          path: ${{ github.workspace }}/fork-source/build/fork-evidence/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
