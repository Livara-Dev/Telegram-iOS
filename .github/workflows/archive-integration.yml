        run: |
          set -euo pipefail
          xcrun simctl list runtimes --json 2>&1 | tee build/fork-evidence/runtime.log
          python3 tools/fork_baseline/prepare_host.py --simulator

      # This job checks out the same requested SHA on a fresh hosted runner.
      # Core compilation may repeat; only pinned public downloads are shared.
      # Startup smoke reuses this job's produced simulator IPA, not another build.
      - name: Build the full simulator app and run TextFormat regression tests
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          IOS_BUNDLE_ID: org.livara.ayugram
