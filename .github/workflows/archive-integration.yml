      - name: Run the historical installer comparison once without recompiling
        if: inputs.startup_historical_control
        run: python3 tools/fork_baseline/installer_control.py run --output build/fork-evidence/startup-replay-historical

      - name: Replay the selected startup control without compiling
        env:
          STARTUP_VARIANT: ${{ inputs.startup_variant || 'original' }}
          STARTUP_PRIVATE_ONLY: ${{ inputs.startup_private_only && 'true' || 'false' }}
        run: |
          set -euo pipefail
          startup_args=(--startup-variant "$STARTUP_VARIANT")
          if [[ "$STARTUP_PRIVATE_ONLY" == 'true' ]]; then
            startup_args+=(--private-control-only)
          elif [[ "$STARTUP_PRIVATE_ONLY" != 'false' ]]; then
            exit 2
          fi
          python3 tools/fork_baseline/startup_replay.py --ipa build/fork-evidence/startup-replay/Telegram.ipa --output build/fork-evidence/startup-replay/replay-controls "${startup_args[@]}"

      - name: Fetch the matching device package only after variant startup passes
        if: success() && inputs.startup_variant == 'main-app-only'
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_RUN: ${{ inputs.replay_run }}
          REPLAY_SOURCE: ${{ inputs.replay_source }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PYTHON'
          import os, subprocess, sys
          sys.path.insert(0, 'tools/fork_baseline')
          from replay_artifact import paired_device_run
          device_run = paired_device_run(os.environ['REPLAY_RUN'], os.environ['REPLAY_SOURCE'])
          subprocess.run([sys.executable, 'tools/fork_baseline/replay_artifact.py',
              '--mode', 'unsigned-device', '--run', str(device_run),
              '--source', os.environ['REPLAY_SOURCE'],
              '--output', 'build/fork-evidence/startup-replay-device'], check=True)
          PYTHON

      - name: Package the verified unsigned main app without recompiling
        if: success() && inputs.startup_variant == 'main-app-only'
        run: |
          set -euo pipefail
          umask 077
          python3 tools/fork_baseline/device_variant.py \
