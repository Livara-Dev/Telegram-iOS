            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay/replay-controls/normal/launch-smoke/checker-compiler.log
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay/replay-controls/normal/launch-smoke/recording.log
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay/replay-controls/normal/launch-smoke/launch.mp4
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay/replay-controls/normal/launch-smoke/launch-1.png
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay/replay-controls/normal/launch-smoke/launch-2.png
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay/replay-controls/no-app-groups/launch-smoke/result.json
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay/replay-controls/no-app-groups/launch-smoke/checker-compiler.log
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay/replay-controls/no-app-groups/launch-smoke/recording.log
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay/replay-controls/no-app-groups/launch-smoke/launch.mp4
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay/replay-controls/no-app-groups/launch-smoke/launch-1.png
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay/replay-controls/no-app-groups/launch-smoke/launch-2.png
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay/replay-controls/main-app-only/launch-smoke/result.json
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay/replay-controls/main-app-only/launch-smoke/checker-compiler.log
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay/replay-controls/main-app-only/launch-smoke/recording.log
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay/replay-controls/main-app-only/launch-smoke/launch.mp4
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay/replay-controls/main-app-only/launch-smoke/launch-1.png
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay/replay-controls/main-app-only/launch-smoke/launch-2.png
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay/replay-controls/main-app-only-automatic/launch-smoke/result.json
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay/replay-controls/main-app-only-automatic/launch-smoke/checker-compiler.log
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay/replay-controls/main-app-only-automatic/launch-smoke/recording.log
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay/replay-controls/main-app-only-automatic/launch-smoke/launch.mp4
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay/replay-controls/main-app-only-automatic/launch-smoke/launch-1.png
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay/replay-controls/main-app-only-automatic/launch-smoke/launch-2.png
            ${{ github.workspace }}/fork-source/build/fork-evidence/startup-replay/SHA256SUMS
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false

      - name: Hash historical comparison diagnostics separately
        if: always() && inputs.startup_historical_control
        run: |
          python3 - <<'PYTHON'
          import hashlib, pathlib
          root = pathlib.Path('build/fork-evidence/startup-replay-historical')
          root.mkdir(parents=True, exist_ok=True)
          names = ['verification.json', 'comparison.json', 'archive-evidence/manifest.json', 'replay-controls/replay.json']
          names += ['replay-controls/main-app-only/launch-smoke/' + name for name in
                    ('result.json', 'checker-compiler.log', 'recording.log', 'launch.mp4', 'launch-1.png', 'launch-2.png')]
          rows = []
          for name in names:
              file = root / name
              if file.is_file() and not file.is_symlink():
                  rows.append(hashlib.sha256(file.read_bytes()).hexdigest() + '  ' + name + '\n')
          (root / 'SHA256SUMS').write_text(''.join(rows))
