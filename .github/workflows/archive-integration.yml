name: Archive application integration (hosted macOS)

on:
  push:
    branches: [ci/verify-latest]
  workflow_dispatch:
    inputs:
      validation_scope:
        description: Startup replay, host API probe, targeted iOS tests, or full qualification
        type: choice
        options: [full, native-only, core-only, focused, projection, projection-only, custom-options-ui, custom-options-replay, custom-options-xctest, probe, retained-clean, retained-modern, projection-plan-only, startup]
        default: full
      replay_run:
        description: Required for startup or retained Projection probe; artifact run ID
        type: string
        default: ''
      replay_source:
        description: Required for startup or retained Projection probe; full source SHA
        type: string
        default: ''
      startup_variant:
        description: Replay original package or isolate the main app without extensions
        type: choice
        options: [original, main-app-only]
        default: original
      startup_private_only:
        description: Run only a fresh explicitly pinned private-storage main-app control
        type: boolean
        default: false
      startup_historical_control:
        description: Compare the fixed historical package once before the c55 private startup control
        type: boolean
        default: false
      retained_projection_tests:
        description: Run the fixed c55 Projection artifact alongside its retained startup check
        type: boolean
        default: false
      projection_host_control:
        description: Diagnostic control for the fixed synthetic Projection host only
        type: choice
        options: [original, resealed-host]
        default: original
      projection_bootstrap_sample:
        description: Capture one bounded synthetic host wait summary before timeout cleanup
        type: boolean
        default: false
      unsigned_device:
        description: Compile an unsigned device IPA alongside exact-commit integration tests
        type: boolean
        default: true

permissions:
  contents: read

# One main qualification run at a time across every branch. Explicit renderer
# diagnostics have their own queue so a failed UI host can be investigated while
# native suites continue. Each queue preserves its active run and keeps only
# its latest pending successor.
# Development branches do not start macOS jobs; advance ci/verify-latest once
# the next reviewed batch is ready. Existing runs retain their original policy.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'startup' && format('ayugram-startup-replay-{0}', inputs.replay_source) || github.event_name == 'workflow_dispatch' && (inputs.validation_scope == 'retained-clean' || inputs.validation_scope == 'retained-modern' || inputs.validation_scope == 'projection-plan-only') && 'ayugram-projection-replay-c55e19c4f5cbe0d730499035d0a0ef712f6903a9' || github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'probe' && inputs.replay_run != '' && format('ayugram-projection-replay-{0}', inputs.replay_source) || github.event_name == 'workflow_dispatch' && (inputs.validation_scope == 'custom-options-ui' || inputs.validation_scope == 'custom-options-replay' || inputs.validation_scope == 'custom-options-xctest') && 'ayugram-ui-qualification' || github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'core-only' && 'ayugram-core-qualification' || 'ayugram-qualification' }}
  cancel-in-progress: false

jobs:
  integration-tests:
    # Full qualification runs these suites in the app job's same private Bazel
    # root. Unknown manual scopes still enter the strict shell case and fail.
    if: github.event_name == 'workflow_dispatch' && inputs.validation_scope != 'full' && inputs.validation_scope != '' && inputs.validation_scope != 'probe' && inputs.validation_scope != 'startup' && inputs.validation_scope != 'custom-options-ui' && inputs.validation_scope != 'custom-options-replay' && inputs.validation_scope != 'custom-options-xctest' && inputs.validation_scope != 'retained-clean' && inputs.validation_scope != 'retained-modern' && inputs.validation_scope != 'projection-plan-only'
    # macos-latest does not satisfy versions.json. This preview image does;
    # prepare_host.py additionally verifies the actual OS/Xcode versions.
    runs-on: xcode-27
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
        working-directory: ./fork-source
    steps:
      # Checkout uses git directly, with the token scoped only to the fetch step.
      - name: Check out the exact requested revision
        working-directory: ${{ github.workspace }}
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib, re, subprocess
          destination = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'fork-source'
          destination.mkdir(mode=0o700)  # Requires a fresh, disposable runner.
          sha = os.environ['GITHUB_SHA']
          repo = os.environ['GITHUB_REPOSITORY']
          if not re.fullmatch(r'[0-9a-f]{40}', sha) or not re.fullmatch(r'[\w.-]+/[\w.-]+', repo):
              raise SystemExit('Invalid checkout coordinates')
          def run(args, env=None):
              subprocess.run(args, cwd=destination, env=env, check=True)
          run(['git', 'init', '-q'])
          run(['git', 'remote', 'add', 'origin', 'https://github.com/' + repo + '.git'])
          auth_env = os.environ.copy()
          token = auth_env.pop('CHECKOUT_TOKEN')
          auth_env.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
                          GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + token).encode()).decode())
          # Both exact trees are needed by the source guard; full history is not.
          run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', sha,
               '279f89e4d4f63f17227bf877dc3d8990f22ecd58'], auth_env)
          run(['git', 'checkout', '--detach', sha])
          # Relative upstream submodule URLs otherwise resolve under Livara-Dev.
          run(['git', 'submodule', 'init'])
          run(['git', 'config', 'submodule.submodules/rlottie/rlottie.url', 'https://github.com/TelegramMessenger/rlottie.git'])
          run(['git', 'config', 'submodule.submodules/TgVoipWebrtc/tgcalls.url', 'https://github.com/TelegramMessenger/tgcalls.git'])
          run(['git', 'submodule', 'update', '--init', '--recursive', '--depth', '1', '--jobs', '8'])
          (destination / 'build/fork-evidence').mkdir(parents=True)
          PY

      # Dependency-only cache: no Bazel output roots, generated repositories,
      # API constants, application archives, keychains or signing profiles.
      - name: Restore public dependency downloads
        continue-on-error: true
        if: github.repository == 'Livara-Dev/Telegram-iOS' && github.ref == 'refs/heads/ci/verify-latest'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/ayugram-public-dependencies-v1/portable
          key: public-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fork-source/MODULE.bazel', 'fork-source/MODULE.bazel.lock', 'fork-source/versions.json') }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            public-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fork-source/MODULE.bazel', 'fork-source/MODULE.bazel.lock', 'fork-source/versions.json') }}-

      - name: Verify restored public dependency bytes
        continue-on-error: true
        if: github.repository == 'Livara-Dev/Telegram-iOS' && github.ref == 'refs/heads/ci/verify-latest'
        run: python3 tools/fork_baseline/dependency_cache.py prepare

      - name: Run portable tooling tests and source guard
        run: |
          set -euo pipefail
          { python3 -m unittest discover -s tools/fork_baseline/tests -v &&
            python3 -m unittest discover -s tools/fork_audit/tests -v &&
            python3 -m unittest discover -s build-system/Make/tests &&
            python3 tools/fork_audit/check.py &&
            python3 tools/fork_audit/telemetry.py; } 2>&1 | tee build/fork-evidence/portable-tests.log

      - name: Validate required API Secrets without exposing their values
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          IOS_BUNDLE_ID: org.livara.ayugram
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'tools/fork_baseline')
          from baseline import configuration, InvalidSetup
          try:
              configuration(os.environ, unsigned=True)
          except InvalidSetup as error:
              print('::error::' + str(error))
              sys.exit(1)
          print('API configuration validated; values omitted.')
          PY

      - name: Select pinned Apple toolchain and prepare verified build tools
        run: |
          set -euo pipefail
          mkdir -p build/fork-evidence
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          python3 tools/fork_baseline/prepare_host.py 2>&1 | tee build/fork-evidence/host.log

      - name: Validate the pinned test runtime
        run: |
          set -euo pipefail
          xcrun simctl list runtimes --json 2>&1 | tee build/fork-evidence/runtime.log
          python3 tools/fork_baseline/prepare_host.py --simulator

      - name: Run real iOS integration suites
        id: integration_tests
        env:
          VALIDATION_SCOPE: ${{ inputs.validation_scope || 'full' }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          IOS_BUNDLE_ID: org.livara.ayugram
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          repair_options=(--integration-tests --tests-only)
          case "$VALIDATION_SCOPE" in
            focused) repair_options+=(--focused-tests) ;;
            projection) repair_options+=(--projection-tests) ;;
            projection-only) repair_options+=(--projection-only-tests) ;;
            native-only) ;;
            core-only) repair_options+=(--core-only-tests) ;;
            full) ;;
            *) echo "Invalid validation scope" >&2; exit 1 ;;
          esac
          python3 tools/fork_baseline/baseline.py simulator "${repair_options[@]}" 2>&1 | tee build/fork-evidence/integration-tests.log

      - name: Export verified public dependency downloads
        continue-on-error: true
        if: always() && github.repository == 'Livara-Dev/Telegram-iOS' && github.ref == 'refs/heads/ci/verify-latest'
        id: public_dependencies
        run: python3 tools/fork_baseline/dependency_cache.py export

      - name: Save public dependency downloads
        continue-on-error: true
        if: always() && steps.public_dependencies.outcome == 'success' && github.repository == 'Livara-Dev/Telegram-iOS' && github.ref == 'refs/heads/ci/verify-latest'
        # Official actions/cache v4.2.4; tag resolved to this commit 2026-11-05.
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/ayugram-public-dependencies-v1/portable
          key: public-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fork-source/MODULE.bazel', 'fork-source/MODULE.bazel.lock', 'fork-source/versions.json') }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Hash early integration test evidence
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          evidence = Path('build/fork-evidence')
          evidence.mkdir(parents=True, exist_ok=True)
          files = sorted(p for p in evidence.rglob('*') if p.is_file() and p.name != 'SHA256SUMS')
          (evidence / 'SHA256SUMS').write_text(''.join(
              hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + str(p.relative_to(evidence)) + '\n'
              for p in files))
          PY

      - name: Publish integration test evidence before the full app build
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: archive-integration-tests-${{ github.sha }}
          path: ${{ github.workspace }}/fork-source/build/fork-evidence/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false

  unsigned-device-build:
    # Compilation must not wait for an unrelated simulator to boot. Passing
    # same-commit integration tests remains a separate release requirement.
    if: github.event_name == 'push' || ((inputs.validation_scope == 'full' || inputs.validation_scope == '') && inputs.unsigned_device)
    # macos-latest does not satisfy versions.json. This preview image does;
    # prepare_host.py additionally verifies the actual OS/Xcode versions.
