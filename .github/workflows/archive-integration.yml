name: Archive application integration (hosted macOS)

# Registration entry on the default branch. The actual qualification workflow
# lives on ci/verify-latest and is loaded when that branch is selected in Actions.
# No source, signing keys or app data is changed by this entry.
on:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: Startup replay, native diagnostics, or full app qualification
        type: choice
        options: [full, focused, probe, startup, projection]
        default: full
      replay_run:
        description: Startup replay; source simulator run ID
        type: string
        default: ''
      replay_source:
        description: Startup only; full compiled application source SHA
        type: string
        default: ''
      startup_variant:
        description: Startup control on ci/startup-replay
        type: choice
        options: [original, main-app-only]
        default: original
      unsigned_device:
        description: Compile an unsigned device IPA alongside exact-commit integration tests
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  select-verification-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Select the prepared verification revision
        run: |
          echo "::error::Select ci/verify-latest for full qualification, integration/ayu-current for native diagnostics, or ci/startup-replay for main-app-only artifact replay."
          exit 1
