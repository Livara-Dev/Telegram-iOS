name: Archive engine draft tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ayugram-archive-diagnostics
  cancel-in-progress: false

jobs:
  storage-tests:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out pinned source without exposing repository credentials
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, os, re, subprocess
          sha = os.environ['GITHUB_SHA']
          repo = os.environ['GITHUB_REPOSITORY']
          if not re.fullmatch(r'[0-9a-f]{40}', sha) or not re.fullmatch(r'[\w.-]+/[\w.-]+', repo):
              raise SystemExit('Invalid checkout coordinates')
          subprocess.run(['git', 'init', '-q'], check=True)
          subprocess.run(['git', 'remote', 'add', 'origin', 'https://github.com/' + repo + '.git'], check=True)
          env = os.environ.copy()
          token = env.pop('CHECKOUT_TOKEN')
          env.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
                     GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + token).encode()).decode())
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', sha,
                          '279f89e4d4f63f17227bf877dc3d8990f22ecd58'], env=env, check=True)
          subprocess.run(['git', 'checkout', '--detach', sha], check=True)
          PY

      - name: Verify pinned toolchain and reviewed source scope
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          python3 - <<'PY'
          import json, platform, subprocess
          pins = json.load(open('versions.json'))
          assert platform.machine() == 'arm64'
          assert subprocess.check_output(['sw_vers', '-productVersion'], text=True).split('.')[0] == pins['macos']
          assert subprocess.check_output(['xcodebuild', '-version'], text=True).splitlines()[0] == 'Xcode ' + pins['xcode']
          PY
          python3 tools/fork_audit/check.py
          python3 tools/fork_audit/telemetry.py
          python3 -m unittest discover -s tools/fork_audit/tests

      - name: Test standalone encrypted archive draft
        run: |
          set -euo pipefail
          mkdir -p build/archive-evidence
          { sw_vers; xcodebuild -version; swift --version; git rev-parse HEAD; } > build/archive-evidence/host.txt
          swift test --package-path submodules/LocalMessageArchive 2>&1 | tee build/archive-evidence/swift-test.log

      - name: Compile archive module for the iOS simulator (not a runtime test)
        run: |
          set -euo pipefail
          archive_ios_sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun swift build --package-path submodules/LocalMessageArchive \
            --target LocalMessageArchive --configuration debug \
            --triple arm64-apple-ios15.0-simulator --sdk "$archive_ios_sdk" \
            --scratch-path "$RUNNER_TEMP/archive-ios-simulator-build" \
            2>&1 | tee build/archive-evidence/ios-compile.log

      - name: Hash draft evidence
        if: always()
        run: |
          python3 - <<'PYCODE'
          import hashlib
          from pathlib import Path
          root = Path('build/archive-evidence')
          root.mkdir(parents=True, exist_ok=True)
          files = sorted(p for p in root.iterdir() if p.is_file() and p.name != 'SHA256SUMS')
          (root / 'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in files))
          PYCODE

      - name: Upload draft test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: archive-draft-${{ github.sha }}
          path: build/archive-evidence/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
